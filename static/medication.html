<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>病院サポート - お薬手帳</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Noto Sans JP', sans-serif; background-color: #f7f9fc; color: #1e293b; }
</style>
</head>
<body class="pb-36">

<header class="fixed top-0 left-0 w-full z-50 flex items-center justify-between px-6 h-16 bg-white border-b border-slate-200">
  <h1 class="text-xl font-bold text-slate-800 mx-auto">お薬手帳</h1>
</header>

<main class="pt-20 px-5 max-w-md mx-auto space-y-6">
  <!-- 写真読み込みボタン -->
  <section class="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm text-center">
    <p class="text-sm font-bold text-slate-700 mb-3">処方袋や説明書をパシャリ！</p>
    <label class="cursor-pointer bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-6 rounded-2xl inline-flex items-center gap-2 shadow-md">
      <span class="material-symbols-outlined">photo_camera</span>
      <span>処方袋を撮影・登録</span>
      <input type="file" id="imageInput" accept="image/*" capture="environment" class="hidden">
    </label>
    <p id="loadingText" class="text-xs text-slate-500 mt-3 hidden">画像を解析中...少々お待ちください</p>
  </section>

  <!-- お薬一覧 -->
  <section class="space-y-3">
    <h2 class="text-lg font-bold text-slate-800">登録済みのお薬</h2>
    <div id="medList" class="space-y-3"></div>
  </section>
</main>

<!-- ボトムナビ -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-20 bg-white border-t border-slate-200 px-2">
  <button onclick="location.href='index.html'" class="flex flex-col items-center justify-center w-1/4 h-full text-slate-600">
    <span class="material-symbols-outlined text-2xl mb-1">home</span>
    <span class="text-xs font-medium">ホーム</span>
  </button>
  <button class="flex flex-col items-center justify-center w-1/4 h-full">
    <div class="bg-emerald-300 text-slate-900 px-5 py-1 rounded-2xl mb-1 flex items-center justify-center">
      <span class="material-symbols-outlined text-xl" style="font-variation-settings:'FILL' 1;">calendar_month</span>
    </div>
    <span class="text-xs font-bold text-slate-900">お薬手帳</span>
  </button>
  <button onclick="location.href='recording.html'" class="flex flex-col items-center justify-center w-1/4 h-full text-slate-600">
    <span class="material-symbols-outlined text-2xl mb-1">mic</span>
    <span class="text-xs font-medium">受診記録</span>
  </button>
  <button class="flex flex-col items-center justify-center w-1/4 h-full text-slate-600">
    <span class="material-symbols-outlined text-2xl mb-1">contact_phone</span>
    <span class="text-xs font-medium">緊急連絡</span>
  </button>
</nav>

<script>
async function loadMeds() {
  const res = await fetch('/medications', { headers: { 'X-Debug-Uid': 'demo-user' } });
  const list = await res.json();
  const container = document.getElementById('medList');
  container.innerHTML = '';

  if (list.length === 0) {
    container.innerHTML = '<p class="text-sm text-slate-400 text-center py-4">登録されたお薬はありません</p>';
    return;
  }

  list.forEach(m => {
    const card = document.createElement('div');
    card.className = 'bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-1';
    card.innerHTML = `
      <div class="flex justify-between items-start">
        <h3 class="text-base font-bold text-slate-800">${m.name}</h3>
        <span class="text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded-md font-medium">${m.dosage || '1回分'}</span>
      </div>
      <p class="text-xs text-emerald-700 font-bold">タイミング: ${m.timing ? m.timing.join('・') : '指定なし'}</p>
      ${m.notes ? `<p class="text-xs text-slate-500">${m.notes}</p>` : ''}
    `;
    container.appendChild(card);
  });
}

document.getElementById('imageInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  const loading = document.getElementById('loadingText');
  loading.classList.remove('hidden');

  const formData = new FormData();
  formData.append('file', file);

  try {
    const res = await fetch('/medications/analyze', {
      method: 'POST',
      headers: { 'X-Debug-Uid': 'demo-user' },
      body: formData
    });
    if (res.ok) {
      alert('お薬情報を登録しました！');
      loadMeds();
    } else {
      alert('画像の解析に失敗しました。');
    }
  } catch (err) {
    alert('通信エラーが発生しました。');
  } finally {
    loading.classList.add('hidden');
  }
});

loadMeds();
</script>
</body>
</html>
